<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Viewer</title></head><body><main class="app-shell"><hiraya-toolbar label="Image viewer"><span class="title" id="title">Image Viewer</span><hiraya-button slot="actions" id="open" disabled>Open</hiraya-button><hiraya-button slot="actions" id="minus" aria-label="Zoom out">−</hiraya-button><output slot="actions" id="zoom">100%</output><hiraya-button slot="actions" id="plus" aria-label="Zoom in">+</hiraya-button><hiraya-button slot="actions" id="fit">Fit</hiraya-button><hiraya-button slot="actions" id="rotate">Rotate</hiraya-button></hiraya-toolbar><section id="stage" class="stage"><hiraya-empty-state id="empty"><strong slot="title">No image open</strong><span>Choose an image to view it.</span></hiraya-empty-state><hiraya-image-viewer id="viewer" zoom="fit" hidden></hiraya-image-viewer></section><hiraya-status-bar id="status" live="polite">Connecting...</hiraya-status-bar></main><script type="module" src="/src/main.ts"></script></body></html>
