<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Viewer</title></head><body><main class="app-shell"><section id="stage" class="stage app-content" aria-busy="true"><hiraya-loading-state id="loading"><strong slot="title">Starting Image Viewer...</strong><span>Preparing the image preview.</span></hiraya-loading-state><div id="image-content" class="image-content" inert aria-hidden="true"><div class="stage-toolbar" role="toolbar" aria-label="Image controls"><hiraya-button id="minus" aria-label="Zoom out" disabled>−</hiraya-button><output id="zoom">100%</output><hiraya-button id="plus" aria-label="Zoom in" disabled>+</hiraya-button><hiraya-button id="fit" disabled>Fit</hiraya-button><hiraya-button id="rotate" disabled>Rotate</hiraya-button></div><hiraya-empty-state id="empty"><strong slot="title">No image open</strong><span>Choose an image to view it.</span></hiraya-empty-state><hiraya-image-viewer id="viewer" zoom="fit" hidden></hiraya-image-viewer></div></section><hiraya-status-bar id="status" live="polite">Connecting...</hiraya-status-bar></main><script type="module" src="/src/main.ts"></script></body></html>
