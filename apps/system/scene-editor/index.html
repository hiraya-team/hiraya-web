<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene Studio</title></head>
<body><main class="app-shell">
  <div id="content" class="app-content" aria-busy="true">
    <hiraya-loading-state id="loading"><strong slot="title">Opening Scene Studio...</strong><span>Preparing the archive workbench.</span></hiraya-loading-state>
    <section id="workbench" class="workbench" inert aria-hidden="true">
      <aside class="files" aria-labelledby="files-title">
        <header><div><h1 id="files-title">Scene files</h1><span id="archive-name">Untitled Scene</span></div><div class="file-actions"><button id="new-file" type="button" title="New text file">+</button><button id="import-assets" type="button" title="Import assets">Import</button></div></header>
        <div id="file-tree" role="listbox" aria-label="Files in Scene package"></div>
        <div class="selected-actions"><button id="rename-file" type="button">Rename</button><button id="delete-file" type="button">Delete</button></div>
      </aside>
      <section class="editor-pane" aria-labelledby="active-file"><header class="pane-header"><h2 id="active-file">No file selected</h2><hiraya-badge id="file-kind" tone="neutral">File</hiraya-badge></header><div id="editor"></div><div id="binary" class="binary" hidden></div></section>
      <section class="preview-pane" aria-labelledby="preview-title"><header class="pane-header"><h2 id="preview-title">Live preview</h2><span id="preview-state">Waiting</span></header><div id="preview"><div class="preview-empty">Choose a text file to begin.</div></div><p id="validation" class="validation" role="status">Draft validation appears here.</p></section>
    </section>
  </div>
  <hiraya-status-bar live="polite"><span id="status">Connecting...</span><hiraya-badge id="conflict" tone="warning" hidden>Remote conflict</hiraya-badge></hiraya-status-bar>
  <dialog id="file-dialog"><form method="dialog"><h2 id="file-dialog-title">Scene file</h2><p id="file-dialog-message"></p><label id="file-dialog-field">File path<input id="file-dialog-input" autocomplete="off" spellcheck="false"></label><div><button value="cancel">Cancel</button><button id="file-dialog-confirm" value="confirm">Continue</button></div></form></dialog>
</main><script type="module" src="/src/main.ts"></script></body></html>
