<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal</title></head><body><main class="terminal-shell"><section id="surface" class="terminal-surface" aria-busy="true"><hiraya-loading-state id="loading"><strong slot="title">Starting Terminal...</strong><span>Mounting the Hiraya file tree.</span></hiraya-loading-state><div id="terminal" class="terminal" inert aria-hidden="true"><div id="transcript" class="transcript" role="log" aria-live="polite" aria-relevant="additions text"></div><form id="prompt" class="prompt"><label id="prompt-label" for="command">/ $</label><textarea id="command" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command" aria-describedby="hint"></textarea><button type="submit" aria-label="Run command">Run</button></form><p id="hint" class="sr-only">Enter runs a command. Shift Enter adds a line. Up and Down browse history. Tab completes a command or path. Control C stops the foreground command.</p></div></section><hiraya-status-bar live="polite"><span id="status">Connecting...</span><hiraya-badge tone="readonly">Hiraya files</hiraya-badge><hiraya-badge tone="readonly" id="write-state" hidden>Read-only</hiraya-badge></hiraya-status-bar></main><script type="module" src="/src/main.ts"></script></body></html>
