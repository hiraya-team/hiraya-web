<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Editor</title></head><body><main class="app-shell"><hiraya-toolbar label="Text editor" wrap><span class="title" id="title">Untitled.txt</span><span class="write-state" id="write-state" hidden>Read-only</span><hiraya-button slot="actions" id="open" disabled>Open</hiraya-button><hiraya-button slot="actions" id="format" disabled>Format</hiraya-button><label slot="actions" class="compact-control">Size <select id="font-size" aria-label="Editor font size" disabled><option>11</option><option>13</option><option>15</option><option>18</option><option>22</option></select></label><label slot="actions" class="compact-control"><input id="line-wrap" type="checkbox" disabled> Wrap</label><label slot="actions" class="compact-control"><input id="auto-save" type="checkbox" disabled> Auto-save</label><label slot="actions" class="compact-control"><input id="auto-format" type="checkbox" disabled> Format on save</label><hiraya-button slot="actions" id="save-as" disabled>Save as</hiraya-button><hiraya-button slot="actions" id="save" variant="primary" disabled>Save</hiraya-button></hiraya-toolbar><textarea id="editor" aria-label="Document text" spellcheck="true" placeholder="Start writing..." readonly></textarea><hiraya-status-bar id="status" live="polite">Connecting...</hiraya-status-bar></main><script type="module" src="/src/main.ts"></script></body></html>
