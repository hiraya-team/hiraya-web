<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Editor</title></head><body><main class="app-shell"><header class="toolbar"><span class="title" id="title">Untitled.txt</span><span class="write-state" id="write-state" hidden>Read-only</span><span class="spacer"></span><button id="open" type="button">Open</button><button id="format" type="button">Format</button><label class="compact-control">Size <select id="font-size" aria-label="Editor font size"><option>11</option><option>13</option><option>15</option><option>18</option><option>22</option></select></label><label class="compact-control"><input id="line-wrap" type="checkbox"> Wrap</label><label class="compact-control"><input id="auto-save" type="checkbox"> Auto-save</label><label class="compact-control"><input id="auto-format" type="checkbox"> Format on save</label><button id="save-as" type="button">Save as</button><button id="save" class="primary" type="button">Save</button></header><textarea id="editor" aria-label="Document text" spellcheck="true" placeholder="Start writing..."></textarea><footer class="status" id="status" role="status">Connecting...</footer></main><script type="module" src="/src/main.ts"></script></body></html>
