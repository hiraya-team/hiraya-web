<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Field</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #14272d; }
    body::before, body::after { content: ""; position: absolute; inset: -35%; filter: blur(42px); }
    body::before { background: conic-gradient(from 120deg at 58% 42%, #183941, #4a7569, #d4a85d, #375d61, #183941); animation: drift 18s ease-in-out infinite alternate; }
    body::after { background: radial-gradient(ellipse at 35% 38%, rgb(115 210 180 / .46), transparent 32%), radial-gradient(ellipse at 70% 58%, rgb(237 181 91 / .34), transparent 28%); mix-blend-mode: screen; animation: breathe 12s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate3d(8%, -5%, 0) rotate(14deg) scale(1.08); } }
    @keyframes breathe { to { transform: translate3d(-6%, 7%, 0) scale(1.14); opacity: .72; } }
  </style>
</head>
<body></body>
</html>
